<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Setu – Admin Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {font-family: Arial, sans-serif; margin:0; display:flex; flex-direction:column; height:100vh;}
    #nav {background:#2c3e50; color:#ecf0f1; padding:0.5rem; display:flex; gap:1rem;}
    #nav a {color:#ecf0f1; text-decoration:none;}
    .panel {padding:1rem; background:#f8f9fa; flex:1; overflow:auto;}
    table {width:100%; border-collapse:collapse;}
    th, td {border:1px solid #ccc; padding:0.5rem; text-align:left;}
  </style>
</head>
<body>
  <div id="nav">
    <a href="health_worker.html">Health Worker</a>
    <a href="patient.html">Patient</a>
    <a href="admin.html">Admin</a>
    <a href="analytics.html">Analytics</a>
  </div>
  <div class="panel">
    <h2>Live Referrals</h2>
    <table id="refTable">
      <thead><tr><th>ID</th><th>From</th><th>To</th><th>Specialist</th><th>Timestamp</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <script>
    const ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onmessage = function(event){
      const data = JSON.parse(event.data);
      if (data.type === 'referralCreated') {
        const r = data.referral;
        const tbody = document.querySelector('#refTable tbody');
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.id}</td><td>${r.from}</td><td>${r.to}</td><td>${r.specialist}</td><td>${r.timestamp}</td>`;
        tbody.appendChild(tr);
      }
    };
    ws.onerror = function(){ console.error('WebSocket error'); };
  </script>
</body>
</html>
